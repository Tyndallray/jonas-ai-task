name: backend

on:
  push:
    branches: [dev, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [dev, prod]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: backend

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  # The branch name is the stage: dev -> dev, prod -> prod.
  # The prod environment is where the manual approval gate lives.
  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref_name == 'dev' || github.ref_name == 'prod')
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name }}
    concurrency:
      group: backend-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm install -g serverless@4.46.0
      - run: serverless deploy --stage ${{ github.ref_name }} --verbose
