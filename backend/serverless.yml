service: jonas-ai-task-backend

frameworkVersion: '4'

params:
  default:
    # SPA origin, used for Cognito callback/sign-out URLs
    frontendUrl: http://localhost:5173
    githubToken: ''
  # Only the hosted stages read the Amplify GitHub token (SSM SecureString)
  dev:
    githubToken: ${ssm:/jonas-ai-task/github-token}
  prod:
    githubToken: ${ssm:/jonas-ai-task/github-token}

provider:
  name: aws
  runtime: nodejs24.x
  architecture: arm64
  region: us-east-1
  # CloudFormation can't resolve ssm-secure for Amplify, so the token goes in as a NoEcho parameter
  stackParameters:
    - ParameterKey: GitHubToken
      ParameterValue: ${param:githubToken}
  environment:
    ADS_TABLE: ${self:service}-ads-${sls:stage}
    IMAGES_BUCKET: !Ref ImagesBucket
    IMAGES_BASE_URL: !Sub https://${ImagesBucket}.s3.${AWS::Region}.amazonaws.com
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - "arn:aws:dynamodb:${aws:region}:*:table/${self:provider.environment.ADS_TABLE}"
            - "arn:aws:dynamodb:${aws:region}:*:table/${self:provider.environment.ADS_TABLE}/index/*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:DeleteObject
          Resource: !Sub ${ImagesBucket.Arn}/ads/*

# Each authorizer trusts only its own pool, so tokens from the other pool are rejected at the gateway.
# Without scopes, Cognito authorizers validate ID tokens (which carry the email claim).
custom:
  amplifyStage:
    prod: PRODUCTION
  userAuthorizer: &userAuthorizer
    name: userAuthorizer
    type: COGNITO_USER_POOLS
    arn: !GetAtt UserPool.Arn
  adminAuthorizer: &adminAuthorizer
    name: adminAuthorizer
    type: COGNITO_USER_POOLS
    arn: !GetAtt AdminPool.Arn

functions:
  listAds:
    handler: src/ads/list.list
    events:
      - http:
          path: ads
          method: get
          cors: true

  getAd:
    handler: src/ads/get.get
    events:
      - http:
          path: ads/{id}
          method: get
          cors: true

  createAd:
    handler: src/ads/create.create
    events:
      - http:
          path: ads
          method: post
          cors: true
          authorizer: *userAuthorizer

  imageUpload:
    handler: src/ads/imageUpload.imageUpload
    events:
      - http:
          path: ads/image-upload
          method: post
          cors: true
          authorizer: *userAuthorizer

  listMyAds:
    handler: src/me/list.list
    events:
      - http:
          path: me/ads
          method: get
          cors: true
          authorizer: *userAuthorizer

  updateMyAd:
    handler: src/me/update.update
    events:
      - http:
          path: me/ads/{id}
          method: put
          cors: true
          authorizer: *userAuthorizer

  deleteMyAd:
    handler: src/me/delete.remove
    events:
      - http:
          path: me/ads/{id}
          method: delete
          cors: true
          authorizer: *userAuthorizer

  adminQueue:
    handler: src/admin/queue.queue
    events:
      - http:
          path: admin/ads
          method: get
          cors: true
          authorizer: *adminAuthorizer

  adminDecide:
    handler: src/admin/decide.decide
    events:
      - http:
          path: admin/ads/{id}/decision
          method: post
          cors: true
          authorizer: *adminAuthorizer

resources:
  Resources:
    AdsTable:
      Type: AWS::DynamoDB::Table
      DeletionPolicy: Retain
      Properties:
        TableName: ${self:provider.environment.ADS_TABLE}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - { AttributeName: id, AttributeType: S }
          - { AttributeName: status, AttributeType: S }
          - { AttributeName: statusAt, AttributeType: N }
          - { AttributeName: ownerId, AttributeType: S }
          - { AttributeName: createdAt, AttributeType: N }
        KeySchema:
          - { AttributeName: id, KeyType: HASH }
        GlobalSecondaryIndexes:
          # Public feed (APPROVED, newest first) and admin queue (PENDING, oldest first)
          - IndexName: byStatus
            KeySchema:
              - { AttributeName: status, KeyType: HASH }
              - { AttributeName: statusAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }
          # "My ads"
          - IndexName: byOwner
            KeySchema:
              - { AttributeName: ownerId, KeyType: HASH }
              - { AttributeName: createdAt, KeyType: RANGE }
            Projection: { ProjectionType: ALL }

    # Authorizer rejections (401/403) need CORS headers too, or the browser hides the status
    GatewayResponseDefault4XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_4XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"

    GatewayResponseDefault5XX:
      Type: AWS::ApiGateway::GatewayResponse
      Properties:
        RestApiId: !Ref ApiGatewayRestApi
        ResponseType: DEFAULT_5XX
        ResponseParameters:
          gatewayresponse.header.Access-Control-Allow-Origin: "'*'"
          gatewayresponse.header.Access-Control-Allow-Headers: "'*'"

    ImagesBucket:
      Type: AWS::S3::Bucket
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: false
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins: ['*']
              AllowedMethods: [GET, POST]
              AllowedHeaders: ['*']

    ImagesBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref ImagesBucket
        PolicyDocument:
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub ${ImagesBucket.Arn}/ads/*

    UserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-users-${sls:stage}
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        Policies:
          PasswordPolicy: { MinimumLength: 8 }

    UserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        UserPoolId: !Ref UserPool
        Domain: ${self:service}-users-${sls:stage}

    UserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref UserPool
        GenerateSecret: false
        SupportedIdentityProviders: [COGNITO]
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        AllowedOAuthScopes: [openid, email, profile]
        CallbackURLs: &userAppUrls !If
          - IsHostedStage
          - ['${param:frontendUrl}/', !Sub 'https://${sls:stage}.${FrontendApp.DefaultDomain}/']
          - ['${param:frontendUrl}/']
        LogoutURLs: *userAppUrls
        # ADMIN_USER_PASSWORD_AUTH lets an operator mint test tokens with IAM credentials
        ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]

    AdminPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: ${self:service}-admins-${sls:stage}
        UsernameAttributes: [email]
        AutoVerifiedAttributes: [email]
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: true
        Policies:
          PasswordPolicy: { MinimumLength: 8 }

    AdminPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        UserPoolId: !Ref AdminPool
        Domain: ${self:service}-admins-${sls:stage}

    AdminPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref AdminPool
        GenerateSecret: false
        SupportedIdentityProviders: [COGNITO]
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows: [code]
        AllowedOAuthScopes: [openid, email, profile]
        CallbackURLs: &adminAppUrls !If
          - IsHostedStage
          - ['${param:frontendUrl}/admin', !Sub 'https://${sls:stage}.${FrontendApp.DefaultDomain}/admin']
          - ['${param:frontendUrl}/admin']
        LogoutURLs: *adminAppUrls
        ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH, ALLOW_ADMIN_USER_PASSWORD_AUTH]

    # Amplify Hosting for the SPA: one app per hosted stage, building the branch named after the stage
    FrontendApp:
      Type: AWS::Amplify::App
      Condition: IsHostedStage
      Properties:
        Name: jonas-ai-task-frontend-${sls:stage}
        Repository: https://github.com/Tyndallray/jonas-ai-task
        AccessToken: !Ref GitHubToken
        Platform: WEB
        EnvironmentVariables:
          - { Name: AMPLIFY_MONOREPO_APP_ROOT, Value: frontend }
        BuildSpec: |
          version: 1
          applications:
            - appRoot: frontend
              frontend:
                phases:
                  preBuild:
                    commands:
                      - nvm install 22
                      - nvm use 22
                      - npm ci
                  build:
                    commands:
                      - npm run build
                artifacts:
                  baseDirectory: dist
                  files:
                    - '**/*'
                cache:
                  paths:
                    - node_modules/**/*
        # Client-side routes (/ads/:id, /admin, ...) serve index.html; files with an extension are served as-is
        CustomRules:
          - Source: '</^[^.]+$|\.(?!(css|gif|ico|jpg|jpeg|js|json|map|png|svg|txt|ttf|webmanifest|webp|woff|woff2)$)([^.]+$)/>'
            Target: /index.html
            Status: '200'

    # Env vars live on the branch (not the app) so the Cognito clients can depend on the app's domain
    FrontendBranch:
      Type: AWS::Amplify::Branch
      Condition: IsHostedStage
      Properties:
        AppId: !GetAtt FrontendApp.AppId
        BranchName: ${sls:stage}
        EnableAutoBuild: true
        Stage: ${self:custom.amplifyStage.${sls:stage}, 'DEVELOPMENT'}
        EnvironmentVariables:
          - { Name: VITE_API_BASE_URL, Value: !Sub 'https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}' }
          - { Name: VITE_COGNITO_AUTHORITY, Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}' }
          - { Name: VITE_COGNITO_CLIENT_ID, Value: !Ref UserPoolClient }
          - { Name: VITE_COGNITO_DOMAIN, Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com' }
          - { Name: VITE_ADMIN_COGNITO_AUTHORITY, Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminPool}' }
          - { Name: VITE_ADMIN_COGNITO_CLIENT_ID, Value: !Ref AdminPoolClient }
          - { Name: VITE_ADMIN_COGNITO_DOMAIN, Value: !Sub 'https://${AdminPoolDomain}.auth.${AWS::Region}.amazoncognito.com' }

  Parameters:
    GitHubToken:
      Type: String
      NoEcho: true
      Default: ''

  Conditions:
    IsHostedStage: !Or
      - !Equals ['${sls:stage}', dev]
      - !Equals ['${sls:stage}', prod]

  Outputs:
    UserPoolId: { Value: !Ref UserPool }
    UserPoolClientId: { Value: !Ref UserPoolClient }
    UserPoolAuthority: { Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}' }
    UserPoolDomainUrl: { Value: !Sub 'https://${UserPoolDomain}.auth.${AWS::Region}.amazoncognito.com' }
    AdminPoolId: { Value: !Ref AdminPool }
    AdminPoolClientId: { Value: !Ref AdminPoolClient }
    AdminPoolAuthority: { Value: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${AdminPool}' }
    AdminPoolDomainUrl: { Value: !Sub 'https://${AdminPoolDomain}.auth.${AWS::Region}.amazoncognito.com' }
    ImagesBucketName: { Value: !Ref ImagesBucket }
    FrontendAppId: { Condition: IsHostedStage, Value: !GetAtt FrontendApp.AppId }
    FrontendUrl: { Condition: IsHostedStage, Value: !Sub 'https://${sls:stage}.${FrontendApp.DefaultDomain}' }
